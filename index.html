<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mãe Gabi | Leituras de Tarô e Oráculos</title>
  
  <!-- Fontes Místicas e Elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #090714;
      --bg-card: rgba(22, 18, 43, 0.78);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-glow: rgba(212, 175, 55, 0.28);
      --purple-accent: #4c2a85;
      --text-main: #f4f1ea;
      --text-muted: #b5aec9;
      --border-gold: rgba(212, 175, 55, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(76, 42, 133, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(212, 175, 55, 0.12) 0%, transparent 45%);
      min-height: 100vh;
    }

    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 80px 120px, var(--gold-light), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 190px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 250px 210px, var(--gold), rgba(0,0,0,0));
      background-size: 300px 300px;
      opacity: 0.4;
    }

    h1, h2, h3, .brand {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    .subtitle-serif {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--gold-light);
    }

    /* Navegação */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      border-bottom: 1px solid var(--border-gold);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 7, 20, 0.88);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-main);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--gold);
    }

    /* Botão de Música Ambiente */
    .music-btn {
      background: rgba(212, 175, 55, 0.16);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 0.5rem 1.1rem;
      border-radius: 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      background: rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .music-btn.playing {
      background: linear-gradient(135deg, #c59b27, #8a6614);
      color: #090714;
      font-weight: 700;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      height: 12px;
      gap: 2px;
    }

    .equalizer span {
      display: block;
      width: 2.5px;
      height: 4px;
      background-color: currentColor;
    }

    .music-btn.playing .equalizer span:nth-child(1) { animation: eq 0.8s infinite ease-in-out; }
    .music-btn.playing .equalizer span:nth-child(2) { animation: eq 0.5s infinite ease-in-out 0.2s; }
    .music-btn.playing .equalizer span:nth-child(3) { animation: eq 1.0s infinite ease-in-out 0.4s; }

    @keyframes eq {
      0%, 100% { height: 4px; }
      50% { height: 13px; }
    }

    /* Barra Flutuante de Áudio no Canto Inferior */
    .floating-audio-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(20, 16, 41, 0.95);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 0.7rem 1.2rem;
      border-radius: 30px;
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      cursor: pointer;
      z-index: 900;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8), 0 0 15px var(--gold-glow);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: transform 0.3s;
    }

    .floating-audio-bar:hover {
      transform: translateY(-3px);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 5.5rem 8% 4rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-symbol {
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 1rem;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.2;
      margin: 0.5rem 0 1.2rem;
      background: linear-gradient(to right, #fff, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0 auto 2.2rem;
    }

    .btn-primary {
      display: inline-block;
      padding: 0.95rem 2.4rem;
      background: linear-gradient(135deg, #c59b27, #e5c158);
      color: #090714;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    }

    /* Seção de Tiragens */
    .section {
      padding: 4rem 8%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: 2.1rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 2rem;
    }

    .tarot-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 2.2rem 1.8rem;
      text-align: center;
      position: relative;
      transition: all 0.35s ease;
